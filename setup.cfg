[metadata]
name = zollo
version = 0.1.0
description = Hybrid bundler for Python and Node.js projects
long_description = file: README.md
long_description_content_type = text/markdown
author = Your Name
license = MIT

[options]
packages = find:
include_package_data = True
python_requires = >=3.9

[options.packages.find]
include = zollo
exclude = py*, node*

[options.entry_points]
console_scripts =
    zollo = zollo.cli:main
